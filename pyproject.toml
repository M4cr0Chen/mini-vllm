[project]
name = "mini-vllm"
version = "0.1.0"
description = "A clean, minimal vLLM-style inference engine for Apple Silicon (MLX)"
requires-python = ">=3.10"
dependencies = [
    "mlx>=0.32",
    "mlx-lm>=0.31",
    "numpy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mini_vllm"]
